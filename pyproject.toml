[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ukinfo-reader"
version = "0.5.0"
description = "A documented Python reader for historical UK-Info Disk databases"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ukinfo-reader contributors"}]
keywords = ["uk-info", "genealogy", "digital-preservation", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Archiving",
]

[project.scripts]
ukinfo-read = "ukinfo_reader.cli:main"
ukinfo-validate = "ukinfo_reader.validation:main"
ukinfo-inspect = "ukinfo_reader.modern_inspect:main"

[project.urls]
Documentation = "https://github.com/abedegno/ukinfo-reader/blob/main/docs/README.md"
Changelog = "https://github.com/abedegno/ukinfo-reader/blob/main/CHANGELOG.md"
Repository = "https://github.com/abedegno/ukinfo-reader"
Issues = "https://github.com/abedegno/ukinfo-reader/issues"

[project.optional-dependencies]
media = ["pycdlib==1.22.0", "py7zr==1.1.4"]
desktop = ["pyinstaller==6.22.3", "pycdlib==1.22.0", "py7zr==1.1.4"]
dev = ["ruff==0.17.1", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
