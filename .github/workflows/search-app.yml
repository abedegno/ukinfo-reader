name: Search application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ukinfo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ukinfo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ukinfo -d ukinfo"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgres://ukinfo:ci-only@127.0.0.1:5432/ukinfo?sslmode=disable
      UKINFO_PLAN_REPORT: ${{ github.workspace }}/build/performance/plans.json
      UKINFO_PERFORMANCE_REPORT_DIR: ${{ github.workspace }}/build/performance
      UKINFO_TEST_DATABASE_URL: postgres://ukinfo:ci-only@127.0.0.1:5432/ukinfo?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Go tests and vet
        working-directory: server
        run: |
          python3 ../tools/check_web_assets.py
          python3 ../tools/test_monitor.py
          python3 ../tools/check_observability.py
          python3 ../tools/check_observability_logs.py
          python3 ../tools/check_covering_search_indexes.py
          python3 ../tools/check_serving_role.py
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          (cd ../tools/search-load && go test -race -count=1 ./... && go vet ./...)
          go build -o ../build/desktop/ukinfo-server ./cmd/ukinfo-server
      - name: Native PostgreSQL lifecycle (Linux)
        working-directory: server
        run: |
          CGO_ENABLED=0 go test -c -o ../build/desktop-lifecycle-linux ./internal/desktop
          docker run --rm --user postgres --env UKINFO_TEST_PG_BIN=/usr/local/bin \
            --volume "$GITHUB_WORKSPACE/build/desktop-lifecycle-linux:/tmp/lifecycle:ro" \
            postgres:18.6-alpine /tmp/lifecycle -test.v
      - name: Desktop supervisor tests
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Browser integration with real Go/PostgreSQL and invented data
        run: |
          build/desktop/ukinfo-server migrate
          python3 tools/search_demo.py | build/desktop/ukinfo-server import
          build/desktop/ukinfo-server index-research --dataset synthetic-demo
          build/desktop/ukinfo-server serve --listen 127.0.0.1:8080 > /tmp/ukinfo-app.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then break; fi
            sleep 0.2
          done
          cd desktop
          npm run test:ui
      - name: Search performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: search-performance
          path: build/performance/*.json
          if-no-files-found: warn
          retention-days: 30
  parade-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      source:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: ukinfo
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ukinfo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ukinfo -d ukinfo"
          --health-interval 2s --health-timeout 2s --health-retries 30
      parade:
        # Official 0.26.3-pg18 amd64 manifest; fixtures are entirely invented.
        image: paradedb/paradedb@sha256:ee076de0ac55b56352371fe224c1413e787b9a99a29507c7a626ee35d802b660
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: parade_test
        ports: ['5433:5432']
        options: >-
          --cpus 2 --memory 3g --shm-size 256m
          --health-cmd "pg_isready -U postgres -d parade_test"
          --health-interval 2s --health-timeout 2s --health-retries 60
    env:
      UKINFO_TEST_DATABASE_URL: postgres://ukinfo:ci-only@127.0.0.1:5432/ukinfo?sslmode=disable
      UKINFO_PARADE_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5433/parade_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.9'
          cache-dependency-path: server/go.sum
      - name: Private preview Compose contracts
        run: python3 tools/check_parade_preview.py
      - name: Dedicated reader policy
        run: |
          docker cp deploy/production/parade-reader.sql ${{ job.services.parade.id }}:/tmp/parade-reader.sql
          docker exec -e UKINFO_PARADE_SEARCH_PASSWORD=ci-only-reader-password-for-invented-fixtures \
            ${{ job.services.parade.id }} sh -c 'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -X -v ON_ERROR_STOP=1 -U postgres -d parade_test -f /tmp/parade-reader.sql'
      - name: All-edition compatibility, publication, rollback and Top-K plans
        working-directory: server
        run: go test -race -count=1 -run '^TestParadeIntegration$' ./internal/catalog
