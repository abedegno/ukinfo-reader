# Production baseline. TLS ingress is required; the origin binds host loopback only.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ukinfo
      POSTGRES_DB: ukinfo
      POSTGRES_PASSWORD: ${UKINFO_DB_PASSWORD:?Set an owner password}
      UKINFO_SEARCH_PASSWORD: ${UKINFO_SEARCH_PASSWORD:?Set a separate serving password}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    command: [postgres, -c, shared_buffers=512MB, -c, work_mem=8MB, -c, max_connections=32, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    volumes:
      - catalogue:/var/lib/postgresql
      - ./production/search-role.sql:/docker-entrypoint-initdb.d/search-role.sql:ro
      - ./production/backup.sh:/checks/backup.sh:ro
      - ${UKINFO_BACKUP_DIR:-../private/production-backups}:/backups
    networks: [database]
    cpus: 2
    mem_limit: 4g
    pids_limit: 256
    shm_size: 512m
    stop_grace_period: 120s
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ukinfo -d ukinfo']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  api:
    image: ukinfo-archive:${UKINFO_IMAGE_TAG:-local}
    build: {context: .., dockerfile: deploy/Dockerfile}
    environment:
      DATABASE_URL: postgres://ukinfo_search:${UKINFO_SEARCH_PASSWORD:?Set a serving password}@db:5432/ukinfo?sslmode=disable
      UKINFO_PUBLIC_ORIGIN: ${UKINFO_PUBLIC_ORIGIN:?Set the HTTPS public origin}
    command: [serve, --listen, '0.0.0.0:8080', --metrics-listen, '127.0.0.1:9091', --public-origin, '${UKINFO_PUBLIC_ORIGIN}', --public-limits, --trusted-proxy, '${UKINFO_TRUSTED_PROXY:-}']
    ports: ['127.0.0.1:8080:8080']
    networks: [database, edge]
    depends_on: {db: {condition: service_healthy}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null --header="Host: $${UKINFO_PUBLIC_ORIGIN#*://}" http://127.0.0.1:8080/api/health']
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  admin:
    profiles: [admin]
    image: ukinfo-archive:${UKINFO_IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://ukinfo:${UKINFO_DB_PASSWORD:?Set an owner password}@db:5432/ukinfo?sslmode=disable
    networks: [database]
    depends_on: {db: {condition: service_healthy}}
    read_only: true
    tmpfs: ['/tmp:mode=1777,size=512m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
volumes:
  catalogue:
networks:
  database: {internal: true}
  edge:
