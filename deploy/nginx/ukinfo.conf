# Include inside nginx's http {}. Replace archive.example.org and certificate paths.
# API listens on loopback only; PostgreSQL and metrics are never proxied publicly.
limit_req_zone $binary_remote_addr zone=ukinfo_search:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ukinfo_export:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=ukinfo_connections:10m;
# Do not log query strings, IPs, referrers or names. This optional aggregate log
# includes status/timing/bytes only; set access_log off for no request logging.
log_format ukinfo_aggregate '$status $request_time $body_bytes_sent';
server {
    listen 443 ssl;
    server_name archive.example.org;
    ssl_certificate /etc/letsencrypt/live/archive.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/archive.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ukinfo-access.log ukinfo_aggregate;
    # nginx error messages may include the original request; keep error logs private,
    # rotate them and redact before sharing. Do not enable debug logging.
    error_log /var/log/nginx/ukinfo-error.log warn;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn ukinfo_connections 4;
    client_max_body_size 1k;
    gzip on;
    gzip_types application/json application/x-ndjson text/css application/javascript;
    gzip_min_length 1024;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /api/export {
        limit_req zone=ukinfo_export burst=2 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host archive.example.org;
        proxy_set_header X-Forwarded-For "";
        # Overwrite the header; Go trusts only this proxy's exact socket peer.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 12s;
        proxy_hide_header X-Powered-By;
    }
    location /api/ {
        limit_req zone=ukinfo_search burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host archive.example.org;
        proxy_set_header X-Forwarded-For "";
        # Overwrite the header; Go trusts only this proxy's exact socket peer.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 12s;
    }
    location = /metrics { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host archive.example.org;
    }
}
server {
    listen 80;
    server_name archive.example.org;
    return 308 https://archive.example.org$request_uri;
}
