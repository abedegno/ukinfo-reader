# Upstream Collector; backend-specific configuration is confined to exporters.
# Token file contains exact raw token bytes with NO trailing newline; readable by UID 10001.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
        max_request_body_size: 1048576
  prometheus:
    config:
      scrape_configs:
        - job_name: ukinfo
          scrape_interval: 60s
          sample_limit: 2000
          static_configs:
            - targets: ['127.0.0.1:9091']
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: 'ukinfo_.*'
              action: keep
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 80
    spike_limit_mib: 20
  filter/metrics:
    error_mode: propagate
    metrics:
      metric:
        - 'not IsMatch(name, "^ukinfo_")'
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name"])
          - set(attributes["service.name"], "ukinfo-server")
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "ukinfo.query.class", "ukinfo.backend", "ukinfo.edition", "ukinfo.parade.stage", "ukinfo.outcome"])
          - set(attributes["ukinfo.backend"], "other") where attributes["ukinfo.backend"] != nil and (not IsString(attributes["ukinfo.backend"]) or not IsMatch(attributes["ukinfo.backend"], "^(paradedb|other)$"))
          - set(attributes["ukinfo.edition"], "other") where attributes["ukinfo.edition"] != nil and (not IsString(attributes["ukinfo.edition"]) or not IsMatch(attributes["ukinfo.edition"], "^(se-pcf78-1998-01|se4-pcf94-1999-04|se2003-dpcs0104|se2004-pcp218-2004-07|se2005-pcf175-2005-06|v14-2008-03:co1-excluded|other)$"))
          - set(attributes["ukinfo.parade.stage"], "other") where attributes["ukinfo.parade.stage"] != nil and (not IsString(attributes["ukinfo.parade.stage"]) or not IsMatch(attributes["ukinfo.parade.stage"], "^(positions|pair_drain|other)$"))
          - set(attributes["ukinfo.outcome"], "error") where attributes["ukinfo.outcome"] != nil and (not IsString(attributes["ukinfo.outcome"]) or not IsMatch(attributes["ukinfo.outcome"], "^(ok|deadline|canceled|query_canceled|error)$"))
      - context: spanevent
        statements:
          - keep_keys(attributes, [])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
          - set(attributes["service.name"], "ukinfo-server")
      - context: datapoint
        statements:
          - keep_keys(attributes, ["route", "status", "class", "plan", "result", "le", "reason", "phase", "outcome", "edition", "stage"])
          - set(attributes["edition"], "other") where attributes["edition"] != nil and (not IsString(attributes["edition"]) or not IsMatch(attributes["edition"], "^(se-pcf78-1998-01|se4-pcf94-1999-04|se2003-dpcs0104|se2004-pcp218-2004-07|se2005-pcf175-2005-06|v14-2008-03:co1-excluded|other)$"))
          - set(attributes["stage"], "other") where attributes["stage"] != nil and (not IsString(attributes["stage"]) or not IsMatch(attributes["stage"], "^(positions|pair_drain|other)$"))
          - set(attributes["outcome"], "error") where attributes["outcome"] != nil and (not IsString(attributes["outcome"]) or not IsMatch(attributes["outcome"], "^(ok|deadline|canceled|query_canceled|error)$"))
  # Prometheus histograms are cumulative; Splunk percentiles need delta buckets.
  cumulativetodelta/latency:
    include:
      metrics: [ukinfo_api_request_duration_seconds, ukinfo_search_phase_duration_seconds, ukinfo_parade_edition_duration_seconds]
      match_type: strict
    initial_value: drop
  batch:
    timeout: 10s
    send_batch_size: 256
    send_batch_max_size: 512
exporters:
  otlphttp/splunk:
    traces_endpoint: https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/trace/otlp
    metrics_endpoint: https://ingest.${env:SPLUNK_REALM}.observability.splunkcloud.com/v2/datapoint/otlp
    headers:
      X-SF-Token: ${file:/run/secrets/splunk_ingest_token}
    timeout: 5s
    compression: gzip
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 32
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
service:
  telemetry:
    logs:
      level: error
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlphttp/splunk]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, filter/metrics, transform/privacy, cumulativetodelta/latency, batch]
      exporters: [otlphttp/splunk]
