# Optional local monitor. It shares only the API network namespace, not its processes.
services:
  monitor:
    image: ukinfo-archive:${UKINFO_IMAGE_TAG:-local}
    user: '${UKINFO_MONITOR_UID:-1000}:${UKINFO_MONITOR_GID:-1000}'
    entrypoint: [/bin/sh, /checks/monitor.sh]
    network_mode: service:api
    depends_on: {api: {condition: service_healthy, restart: true}}
    environment:
      UKINFO_PUBLIC_ORIGIN: ${UKINFO_PUBLIC_ORIGIN:?Set the public origin}
      UKINFO_MIN_FREE_GIB: '${UKINFO_MIN_FREE_GIB:-20}'
      UKINFO_BACKUP_MAX_DAYS: '${UKINFO_BACKUP_MAX_DAYS:-30}'
    volumes:
      - ./production/monitor.sh:/checks/monitor.sh:ro
      - ${UKINFO_BACKUP_DIR:-../private/production-backups}/monitor:/state
      - ${UKINFO_ALERT_FILE:-/dev/null}:/run/secrets/alert_webhook:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 32
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'test -r /state/heartbeat && test $$(($$(date +%s)-$$(cat /state/heartbeat))) -lt 180']
      interval: 60s
      timeout: 3s
      retries: 2
      start_period: 90s
    logging: {driver: json-file, options: {max-size: 1m, max-file: '3'}}
